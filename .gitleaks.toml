# gitleaks 설정 — quantmaster-pro
#
# 정책: 기본 룰셋(extend default) + 프로젝트별 allowlist 만 추가한다.
# allowlist 는 "실제 비밀이 아닌 것이 확실한 패턴"만 등록한다.
#
# 운영 원칙:
#   - .env.example 의 placeholder(`xxxxxxxxxxx...`, `AIzaSy_xxx...`) 는 검사 제외.
#   - 실제 비밀은 어떤 경우에도 코드/주석/문서에 들어가서는 안 된다.
#   - false positive 추가 시 반드시 PR 설명에 근거를 기재한다.

title = "quantmaster-pro gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "프로젝트 전역 화이트리스트"

paths = [
  # 환경변수 템플릿 — 모든 값이 placeholder
  '''\.env\.example$''',
  # 운영 문서의 키 형식 예시
  '''README\.md$''',
  '''SECURITY\.md$''',
  '''ARCHITECTURE\.md$''',
  # 검증 스크립트 자체에 들어 있는 정규식 패턴
  '''^scripts/scan_exposure\.js$''',
  '''^scripts/validate_gemini_calls\.(js|py)$''',
  # node_modules / lockfile / 빌드 산출물
  '''^node_modules/''',
  '''^package-lock\.json$''',
  '''^dist/''',
  '''^build/''',
]

regexes = [
  # x로만 채운 placeholder ("KIS_APP_SECRET=xxxxxxxx..." 등)
  '''=\s*x{8,}\b''',
  # Google 키 placeholder ("AIzaSy_xxxxxxxx..." / "AIza...")
  '''AIza(Sy)?_?x{8,}''',
  '''AIza\.\.\.''',
  # "your-..." / "<...>" 류 일반 placeholder
  '''=\s*your[-_].+''',
  '''=\s*<[^>]+>''',
  # `env.XXX` 속성 접근식(예: `keySignal: env.m2GrowthYoY`) —
  # 매크로 엔진의 도메인 필드 참조로, 실제 비밀이 아님.
  '''^env\.[A-Za-z][A-Za-z0-9]*$''',
  # `key: Gate3ThresholdKey` (server/quant/gate3EvidenceScore.ts) — TypeScript
  # 타입명 식별자. generic-api-key 룰이 `key:` 뒤 17자 토큰(엔트로피 3.69)을
  # 비밀로 오탐. 실제 비밀이 아닌 타입 어노테이션이므로 좁게 화이트리스트.
  '''Gate3ThresholdKey''',
  # `key: Gate3ForwardHorizon` (server/learning/unifiedForwardOutcomeLabeler.ts) —
  # 위와 동일 클래스의 TypeScript 타입명 오탐. generic-api-key 룰이 `key:` 뒤
  # 타입 식별자(엔트로피 3.64)를 비밀로 오인. 실제 비밀이 아니므로 좁게 화이트리스트.
  '''Gate3ForwardHorizon''',
  # `process.env.FRED_API_KEY = 'test-key-1234567890'` (server/clients/fredClientProbeBase.test.ts) —
  # 테스트용 더미 키(접두사 test-key-). generic-api-key 룰이 엔트로피 3.93 으로 오탐.
  # 같은 테스트 line 34 가 `not.toContain('test-key-1234567890')` 로 키 미노출을 검증하는 의도적
  # placeholder 이며 실제 비밀이 아니다. CI 가 fetch-depth=0 전체 history 스캔이라 좁게 화이트리스트.
  '''test-key-1234567890''',
]

# ADR-461 livePathSafetyAudit.ts 의 과거 false positive.
# 원본은 static audit descriptor object의 field name + label 조합이며 실제 secret이 아니다.
# 현재 main에서는 descriptor field를 `key` -> `flag` 로 변경했지만, CI가 fetch-depth=0으로
# 전체 git history를 스캔하므로 과거 fingerprint를 좁게 allowlist한다.
commits = [
  "95075716044aa416ddb4cabd3e86fb72a1884885",
  "f952e3b1b149d493d43767d0f4518f766b2da52e",
]
