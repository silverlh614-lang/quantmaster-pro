name: gate-diagnostics-selfpatch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gate-diagnostics-selfpatch.yml'

permissions:
  contents: write

env:
  CI: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch gate diagnostics
        run: |
          python <<'PY'
          from pathlib import Path

          def rep(path: str, before: str, after: str, expected: int = 1) -> None:
              p = Path(path)
              s = p.read_text()
              count = s.count(before)
              if count != expected:
                  raise RuntimeError(f'{path}: expected {expected}, found {count}\n{before}')
              p.write_text(s.replace(before, after, expected))

          rep('server/quant/gate2Diagnostics/types.ts',
              "export type Gate2EvaluationStage = 'DISCOVERY_GATE' | 'REFRESHED_GATE' | 'ENTRY_RECHECK_GATE' | string;",
              """export type Gate2EvaluationStage =
  | 'DISCOVERY_GATE'
  | 'REFRESHED_GATE'
  | 'ENTRY_RECHECK_GATE'
  | 'SELL_ONLY_SESSION'
  | 'AFTERMARKET_SESSION'
  | string;""")

          rep('server/quant/gate2Diagnostics/externalCoverage.ts',
              """export function providerFromMetadata(value: unknown, defaults: { verified: string; cache: string; unknown: string }): string {
  if (!value || typeof value !== 'object') return defaults.unknown;
  const record = value as Record<string, unknown>;
  const raw = String(record.provider ?? record.source ?? record.dataSource ?? '').toUpperCase();
  if (raw.includes('CACHE')) return defaults.cache;
  if (raw.includes('KIS_OFFICIAL')) return 'KIS_OFFICIAL';
  if (raw.includes('KIS')) return 'KIS_API';
  if (raw.includes('DART')) return 'DART';
  if (raw.includes('KOSPI') || raw.includes('INDEX')) return 'KOSPI_INDEX';
  if (raw.includes('QMP')) return 'QMP_MACRO';
  return defaults.verified;
}
""",
              """export function providerFromMetadata(value: unknown, defaults: { verified: string; cache: string; unknown: string }): string {
  if (!value || typeof value !== 'object') return defaults.unknown;
  const record = value as Record<string, unknown>;
  const raw = String(record.provider ?? record.source ?? record.dataSource ?? '').toUpperCase();
  if (raw.includes('CACHE')) return defaults.cache;
  if (raw.includes('KIS_OFFICIAL')) return 'KIS_OFFICIAL';
  if (raw.includes('KIS')) return 'KIS_API';
  if (raw.includes('DART')) return 'DART';
  if (raw.includes('KOSPI') || raw.includes('INDEX')) return 'KOSPI_INDEX';
  if (raw.includes('QMP')) return 'QMP_MACRO';
  return defaults.verified;
}

export function isDeferredGate2EvaluationStage(evaluationStage?: Gate2EvaluationStage | null): boolean {
  return evaluationStage === 'DISCOVERY_GATE'
    || evaluationStage === 'SELL_ONLY_SESSION'
    || evaluationStage === 'AFTERMARKET_SESSION';
}
""")
          rep('server/quant/gate2Diagnostics/externalCoverage.ts',
              "input.evaluationStage === 'DISCOVERY_GATE' ? 'STAGE_NOT_FETCHED' : 'MISSING'",
              "isDeferredGate2EvaluationStage(input.evaluationStage) ? 'STAGE_NOT_FETCHED' : 'MISSING'", 2)
          rep('server/quant/gate2Diagnostics/externalCoverage.ts',
              "if (!fieldsAvailable && input.evaluationStage === 'DISCOVERY_GATE') return 'STAGE_NOT_FETCHED';",
              "if (!fieldsAvailable && isDeferredGate2EvaluationStage(input.evaluationStage)) return 'STAGE_NOT_FETCHED';")
          rep('server/quant/gate2Diagnostics/externalCoverage.ts',
              "return evaluationStage === 'DISCOVERY_GATE' ? 'STAGE_NOT_FETCHED' : 'MISSING';",
              "return isDeferredGate2EvaluationStage(evaluationStage) ? 'STAGE_NOT_FETCHED' : 'MISSING';")
          rep('server/quant/gate2Diagnostics/externalCoverage.ts',
              """? evaluationStage === 'DISCOVERY_GATE' ? 'STAGE_NOT_FETCHED' : 'MISSING'
    : metadataStatus ?? (overallRisk !== 'UNKNOWN' ? 'VERIFIED' : 'UNKNOWN');""",
              """? isDeferredGate2EvaluationStage(evaluationStage) ? 'STAGE_NOT_FETCHED' : 'MISSING'
    : metadataStatus ?? (overallRisk !== 'UNKNOWN' ? 'VERIFIED' : 'UNKNOWN');""")

          rep('server/quant/gate2Diagnostics/consolidatedDiagnostic.ts',
              """export function gate2StageNotFetched(external: Gate2ExternalDataCoverage, evaluationStage?: Gate2EvaluationStage | null): boolean {
  const coreNotFetched = external.kisInvestorFlow.status === 'STAGE_NOT_FETCHED'
    && external.dartFinancials.status === 'STAGE_NOT_FETCHED'
    && external.benchmark.status === 'STAGE_NOT_FETCHED';
  return coreNotFetched && (!evaluationStage || evaluationStage === 'DISCOVERY_GATE');
}
""",
              """export function gate2DeferredFetchStage(evaluationStage?: Gate2EvaluationStage | null): boolean {
  return !evaluationStage
    || evaluationStage === 'DISCOVERY_GATE'
    || evaluationStage === 'SELL_ONLY_SESSION'
    || evaluationStage === 'AFTERMARKET_SESSION';
}

export function gate2StageNotFetched(external: Gate2ExternalDataCoverage, evaluationStage?: Gate2EvaluationStage | null): boolean {
  if (!gate2DeferredFetchStage(evaluationStage)) return false;
  const coreStatuses = [
    external.kisInvestorFlow.status,
    external.dartFinancials.status,
    external.benchmark.status,
  ];
  const anyStageNotFetched = coreStatuses.includes('STAGE_NOT_FETCHED');
  const noBlockingMissing = coreStatuses.every(status =>
    ['VERIFIED', 'PARTIAL', 'EMPTY_VALID', 'STAGE_NOT_FETCHED', 'UNKNOWN'].includes(status),
  );
  return anyStageNotFetched && noBlockingMissing;
}
""")
          rep('server/quant/gate2Diagnostics/consolidatedDiagnostic.ts',
              "if (health === 'STAGE_NOT_FETCHED') return 'Gate2 external data is intentionally not fetched at discovery stage.';",
              "if (health === 'STAGE_NOT_FETCHED') return 'Gate2 external data is intentionally not fetched at this evaluation stage.';")

          rep('server/quant/gate3Diagnostics.ts',
              """  const dataMode: Gate3IntradayTimingDiagnostic['dataMode'] = hasIntraday && hasEod ? 'MIXED' : hasIntraday ? 'INTRADAY' : hasEod ? 'EOD_ONLY' : 'UNKNOWN';
  if (dataMode === 'EOD_ONLY') notes.push('INTRADAY_NOT_FETCHED_EOD_ONLY');
""",
              """  const dataMode: Gate3IntradayTimingDiagnostic['dataMode'] = hasIntraday && hasEod ? 'MIXED' : hasIntraday ? 'INTRADAY' : hasEod ? 'EOD_ONLY' : 'UNKNOWN';
  const eodOnlyExpected = ['AFTERMARKET', 'SELL_ONLY', 'CLOSED', 'HOLIDAY'].includes(session);
  if (dataMode === 'EOD_ONLY') {
    notes.push(eodOnlyExpected ? 'INTRADAY_NOT_FETCHED_EOD_ONLY_EXPECTED' : 'INTRADAY_NOT_FETCHED_EOD_ONLY');
  }
""")

          rep('server/quant/gate3ConsolidatedDiagnostic.ts',
              """  const lastTick = asRecord(intraday.lastTick);
  const quoteFreshness = asRecord(intraday.quoteFreshness);
""",
              """  const lastTick = asRecord(intraday.lastTick);
  const quoteFreshness = asRecord(intraday.quoteFreshness);
  const sessionCompatibility = asRecord(intraday.sessionCompatibility);
  const intradaySession = asString(sessionCompatibility.session) ?? 'UNKNOWN';
  const eodOnlyExpected = ['AFTERMARKET', 'SELL_ONLY', 'CLOSED', 'HOLIDAY'].includes(intradaySession);
""")
          rep('server/quant/gate3ConsolidatedDiagnostic.ts',
              """  } else if (asString(intraday.dataMode) === 'EOD_ONLY' || asString(intraday.status) === 'STAGE_NOT_FETCHED') {
    health = 'WARN'; primaryIssue = 'INTRADAY_NOT_FETCHED_EOD_ONLY'; operatorAction = 'WAIT_FOR_INTRADAY_CONFIRMATION';
  }
""",
              """  } else if (asString(intraday.dataMode) === 'EOD_ONLY' || asString(intraday.status) === 'STAGE_NOT_FETCHED') {
    if (!eodOnlyExpected) {
      health = 'WARN'; primaryIssue = 'INTRADAY_NOT_FETCHED_EOD_ONLY'; operatorAction = 'WAIT_FOR_INTRADAY_CONFIRMATION';
    }
  }
""")

          rep('server/quantFilter.ts',
              """  const gate3Wiring = buildGate3WiringDiagnostics({ outputs, layerMap: GATE_CONDITION_LAYER_MAP });
  (summary.gate3 as unknown as { wiring?: Gate3WiringDiagnostic[] }).wiring = gate3Wiring;
  (summary.gate3 as unknown as { sourceCoverage?: Gate3SourceCoverage }).sourceCoverage = buildGate3SourceCoverage(gate3Wiring);
  (summary.gate3 as unknown as { externalDataCoverage?: Gate3ExternalDataCoverage }).externalDataCoverage = buildGate3ExternalDataCoverage(gate2ExternalCoverageInput.quote as Record<string, unknown> ?? {});
  summary.gate3.consolidatedDiagnostic = buildGate3ConsolidatedDiagnostic({ gate3: summary.gate3 });
""",
              """  const gate3Wiring = buildGate3WiringDiagnostics({ outputs, layerMap: GATE_CONDITION_LAYER_MAP });
  (summary.gate3 as unknown as { wiring?: Gate3WiringDiagnostic[] }).wiring = gate3Wiring;
  (summary.gate3 as unknown as { sourceCoverage?: Gate3SourceCoverage }).sourceCoverage = buildGate3SourceCoverage(gate3Wiring);
  const gate3Quote: Record<string, unknown> = gate2ExternalCoverageInput.quote && typeof gate2ExternalCoverageInput.quote === 'object'
    ? { ...(gate2ExternalCoverageInput.quote as Record<string, unknown>) }
    : {};
  if (gate2ExternalCoverageInput.evaluationStage === 'SELL_ONLY_SESSION') {
    gate3Quote.marketSession = { session: 'SELL_ONLY', liveBuyAllowed: false, shadowAllowed: true };
  } else if (gate2ExternalCoverageInput.evaluationStage === 'AFTERMARKET_SESSION') {
    gate3Quote.marketSession = { session: 'AFTERMARKET', liveBuyAllowed: false, shadowAllowed: true };
  }
  (summary.gate3 as unknown as { externalDataCoverage?: Gate3ExternalDataCoverage }).externalDataCoverage = buildGate3ExternalDataCoverage(gate3Quote);
  summary.gate3.consolidatedDiagnostic = buildGate3ConsolidatedDiagnostic({ gate3: summary.gate3 });
""")

          rep('server/screener/universeScanner.ts',
              """    const gate = evaluateServerGate(
      enrichedQuote,
      weights,
      kospi20dReturn,
      null,
      null,
      regime,
    );""",
              """    const gate = evaluateServerGate(
      enrichedQuote,
      weights,
      kospi20dReturn,
      null,
      null,
      regime,
      'DISCOVERY_GATE',
    );""")
          rep('server/screener/universeScanner.ts',
              """        const refreshedGate = evaluateServerGate(
          c.quote,
          weights,
          kospi20dReturn,
          null,
          flow,
          regime,
        );""",
              """        const refreshedGate = evaluateServerGate(
          c.quote,
          weights,
          kospi20dReturn,
          null,
          flow,
          regime,
          'DISCOVERY_GATE',
        );""")
          rep('server/screener/universeScanner.ts',
              """    const refreshedGate = evaluateServerGate(
      c.quote,
      weights,
      macroState?.kospi20dReturn,
      dartFinByCode.get(c.code) ?? null,
      kisFlowForGate,
      regime,
    );""",
              """    const refreshedGate = evaluateServerGate(
      c.quote,
      weights,
      macroState?.kospi20dReturn,
      dartFinByCode.get(c.code) ?? null,
      kisFlowForGate,
      regime,
      'REFRESHED_GATE',
    );""")

          rep('server/trading/signalScanner/perSymbol/steps/preBreakoutEntry.ts',
              """        const reCheckGatePb = evaluateServerGate(
          accumulation.quote,
          ctx.conditionWeights,
          ctx.macroState?.kospi20dReturn,
          dartFinPb,
          kisFlowPb,
          ctx.regime,
        );""",
              """        const reCheckGatePb = evaluateServerGate(
          accumulation.quote,
          ctx.conditionWeights,
          ctx.macroState?.kospi20dReturn,
          dartFinPb,
          kisFlowPb,
          ctx.regime,
          macroDiagnosticLiveBlock
            || ctx.diagnosticOnlyLiveBlock
            || (ctx.liveEntryBlockedReason ?? '').includes('SELL_ONLY')
            || (ctx.liveEntryBlockedReason ?? '').includes('R6_DEFENSE')
            ? 'SELL_ONLY_SESSION'
            : ctx.resolvedMarketSessionState === 'AFTER_HOURS'
              || ctx.resolvedMarketSessionState === 'CLOSED'
              || ctx.resolvedMarketSessionState === 'NON_TRADING_DAY'
              || shadowApprovalCtx.marketSession === 'AFTER_HOURS'
              || shadowApprovalCtx.marketSession === 'CLOSED'
                ? 'AFTERMARKET_SESSION'
                : 'ENTRY_RECHECK_GATE',
        );""")

          rep('server/quant/gate2DartStageDiagnostics.test.ts',
              "  it('keeps entry recheck DART null as missing diagnostic only', () => {",
              """  it('labels sell-only DART null as stage-not-fetched without provider issue', () => {
    const result = evaluateGate2WithDartNull('SELL_ONLY_SESSION');
    const gate2 = result.gateLayerSummary?.gate2;
    const dart = gate2?.externalDataCoverage?.dartFinancials;
    const compact = gate2?.consolidatedDiagnostic?.compactText ?? '';

    expect(dart).toMatchObject({
      status: 'STAGE_NOT_FETCHED',
      stageNotFetched: true,
      providerIssue: false,
      marketSignal: false,
    });
    expect(compact).toContain('DART=WAIT');
    expect(compact).not.toContain('DART_FINANCIALS_UNAVAILABLE');
    expect(gate2?.consolidatedDiagnostic?.marketSignal).toBe(false);
  });

  it('labels aftermarket DART null as stage-not-fetched without provider issue', () => {
    const result = evaluateGate2WithDartNull('AFTERMARKET_SESSION');
    const gate2 = result.gateLayerSummary?.gate2;
    const dart = gate2?.externalDataCoverage?.dartFinancials;
    const compact = gate2?.consolidatedDiagnostic?.compactText ?? '';

    expect(dart).toMatchObject({
      status: 'STAGE_NOT_FETCHED',
      stageNotFetched: true,
      providerIssue: false,
      marketSignal: false,
    });
    expect(compact).toContain('DART=WAIT');
    expect(compact).not.toContain('DART_FINANCIALS_UNAVAILABLE');
    expect(gate2?.consolidatedDiagnostic?.marketSignal).toBe(false);
  });

  it('keeps entry recheck DART null as missing diagnostic only', () => {""")

          rep('server/quant/gate3Diagnostics.test.ts',
              "  it('intraday timing: stale last tick is freshness issue only', () => {",
              """  it('intraday timing: aftermarket eod only is expected, not warning issue', () => {
    const now = new Date('2026-05-20T09:00:00.000Z');
    const q = quote({
      asOf: new Date(now.getTime() - 10_000).toISOString(),
      marketSession: { session: 'AFTERMARKET', liveBuyAllowed: false, shadowAllowed: true },
    } as QuoteLike);
    const diag = normalizeGate3IntradayTiming({
      now,
      quote: q as unknown as Record<string, unknown>,
      intraday: null,
      minuteBars: null,
    });
    const gate = evaluateServerGate(q, DEFAULT_CONDITION_WEIGHTS, 1, null, null, undefined, 'AFTERMARKET_SESSION');
    const compact = gate.gateLayerSummary?.gate3.consolidatedDiagnostic?.compactText ?? '';

    expect(diag.dataMode).toBe('EOD_ONLY');
    expect(diag.notes).toContain('INTRADAY_NOT_FETCHED_EOD_ONLY_EXPECTED');
    expect(diag.notes).not.toContain('INTRADAY_NOT_FETCHED_EOD_ONLY');
    expect(compact).toContain('intraday=EOD_ONLY');
    expect(compact).not.toContain('issue=INTRADAY_NOT_FETCHED_EOD_ONLY');
    expect(compact).not.toContain('Gate3: WARN |');
  });

  it('intraday timing: stale last tick is freshness issue only', () => {""")

          Path('.github/workflows/gate-diagnostics-selfpatch.yml').unlink()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run focused tests
        run: |
          npm test -- server/quant/gate2DartStageDiagnostics.test.ts
          npm test -- server/quant/gate3Diagnostics.test.ts
          npm test -- server/gatePipelineAudit.test.ts
          npm test -- server/scanBlockers.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/quant/gate2Diagnostics/types.ts \
            server/quant/gate2Diagnostics/externalCoverage.ts \
            server/quant/gate2Diagnostics/consolidatedDiagnostic.ts \
            server/quant/gate3Diagnostics.ts \
